# Place this file at: /etc/nginx/sites-available/fodek-admin
# Then: ln -sf /etc/nginx/sites-available/fodek-admin /etc/nginx/sites-enabled/fodek-admin
# Then: nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name flod.uat.fodek.net;

    # FODEK Admin Panel (new — port 3010)
    location / {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 20M;
    }
}

# If SSL is handled by an existing certbot block, keep those listen 443 lines
# and just update the proxy_pass inside the location block to http://127.0.0.1:3010
